name: 定期ワークフロー維持

on:
  schedule:
    # 公開リポジトリの60日無活動によるschedule停止を避けるため、毎月実行する。
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-scheduled-workflows-active
  cancel-in-progress: false

jobs:
  keepalive:
    name: 定期ワークフローを有効に保つ
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 保守用コミットを記録
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin "${{ github.event.repository.default_branch }}"
          git commit --allow-empty -m "chore: keep scheduled workflows active [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
